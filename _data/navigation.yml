# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add
# additional links (including plain external URLs, e.g. to other GitHub
# Pages sites) -- removing a link only hides it from the header, it does
# not remove the underlying page.
#
# Portfolio and Blog Posts are deliberately left out of the nav for now
# (no content yet); the collections/pages exist and are ready to grow into
# -- just add entries here whenever there's something to link to.

main:
  - title: "About"
    url: /about/

  - title: "CV"
    url: /cv/

  - title: "Publications"
    url: /publications/

  - title: "Talks"
    url: /talks/

  - title: "Teaching"
    url: /teaching/

  # Not a page in this repo: the Problem-Solving Club is its own Jekyll site,
  # published as a project site under this domain at /psclub/. A root-relative
  # URL is all it takes -- the masthead renders it like any other entry.
  - title: "Problem-Solving Club"
    url: /psclub/

  - title: "Thanks"
    url: /thanks/
