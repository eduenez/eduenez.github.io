research_interests:
  summary: >
    My research revolves around analysis in a broad sense.
    I have worked on random matrix theory
    (Dyson's “Threefold Way”; linear group ensembles)
    and number theory (zeros of L-functions);
    nowadays, my research is on the foundations of analysis and probability,
    as well as both theoretical and applied aspects of real-valued computing.
  applications:
    - "Measure, integration, probability, and information theory"
    - "Real-valued computability (deterministic, randomized, and quantum)"
    - "Statistical/machine learning and AI foundations"

