# Canonical, hand-maintained CV content. This file is the single source of
# truth for the sections below ONLY. It intentionally does NOT contain:
#   - Publications: see `publications_manifest.yml` (bibtex keys resolved
#     against the `math-bibliography` submodule at generation time).
#   - Talks: see `talks.yml`.
#   - Teaching: see `teaching.yml`.
# All three are treated as derived-from-elsewhere content, even though (for
# now, before the Jekyll site exists) they happen to be checked in as plain
# YAML alongside this file.
#
# Conventions:
#   - Prose fields (`details`, `summary`, etc.) are Markdown, rendered via
#     Jekyll's `markdownify` for the web view and via Pandoc for the LaTeX/PDF
#     view.
#   - Every list entry has a stable, hand-assigned kebab-case `id` for
#     permalinks/cross-references; never reuse or renumber an existing id.
#   - Date ranges are structured as `start_year` / `end_year`; omit
#     `end_year` to mean "present". Render the display string
#     (e.g. "2011 - Present") at generation time, not by hand here.

